server {
    listen 80 default_server;
    server_name _;   # catch-all: matches localhost, IP, hostname

    # ── IT Assets (Angular SPA) ───────────────────────────────────────
    location ^~ /it-asset/ {
        alias /var/www/html/it-asset/;
        index index.html;
        try_files $uri $uri/ /it-asset/index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── IT Assets API Proxy (NestJS Backend) ───────────────────────────
    location /api/ {
        proxy_pass https://127.0.0.1:3000/;
        proxy_ssl_verify off;              # backend uses self-signed cert
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy Swagger docs
    location = /api/docs {
        proxy_pass https://127.0.0.1:3000/api/docs;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/docs/ {
        proxy_pass https://127.0.0.1:3000/api/docs/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── AC Medical (PHP site) ─────────────────────────────────────────
    location ^~ /ac-medical/ {
        alias /var/www/html/ac-medical/;
        index index.php index.html;
        try_files $uri $uri/ @ac_medical_php;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        }
    }

    location @ac_medical_php {
        rewrite ^/ac-medical/(.*)$ /ac-medical/index.php?$1 last;
    }

    # ── Root and Direct Route redirects ───────────────────────────────
    location = / {
        return 302 /it-asset/;
    }

    # Redirect any direct access to SPA routes (e.g. /assets/..., /dashboard) to /it-asset/...
    location ~ ^/(dashboard|assets|activities|scan|users|settings|login)(.*)$ {
        return 302 /it-asset$request_uri;
    }

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
