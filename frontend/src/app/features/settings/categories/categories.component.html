<div class="max-w-4xl mx-auto space-y-6 flex-1 flex flex-col w-full">
  <div class="flex items-center space-x-4 md:hidden">
    <a routerLink="/settings" class="p-2 bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-colors">
      <lucide-icon name="arrow-left" [size]="20"></lucide-icon>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-slate-800 flex items-center">
        <lucide-icon name="tags" [size]="24" class="mr-2 text-indigo-600"></lucide-icon>
        Manage Categories
      </h1>
      <p class="text-sm text-slate-500 mt-1">Organize your assets into functional categories.</p>
    </div>
  </div>

  <!-- Projected Header Actions for Desktop Layout -->
  <ng-template appPageHeaderActions>
    <div class="flex items-center gap-2">
      <!-- Search Input in Header -->
      <div class="relative group">
        <div class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors pointer-events-none">
          <lucide-icon name="search" [size]="14"></lucide-icon>
        </div>
        <input 
          type="text" 
          [ngModel]="searchTerm"
          (ngModelChange)="onSearchChange($event)"
          placeholder="Search categories..." 
          class="pl-8 pr-7 py-1.5 bg-slate-50 hover:bg-slate-100/80 border border-slate-200/90 rounded-lg text-xs text-slate-800 placeholder:text-slate-400 focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none w-48 sm:w-56 transition-all duration-150 shadow-2xs"
        >
        @if (searchTerm) {
          <button 
            type="button"
            (click)="onSearchChange('')" 
            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer">
            <lucide-icon name="x" [size]="12"></lucide-icon>
          </button>
        }
      </div>

      <!-- Add Category Button in Header -->
      <button (click)="startAddCategory()" class="bg-primary hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-2xs shadow-indigo-200 active:scale-95 cursor-pointer shrink-0">
        <lucide-icon name="plus" [size]="14"></lucide-icon>
        <span>Add Category</span>
      </button>
    </div>
  </ng-template>

  <!-- Mobile-only Search & Add Header (hidden on desktop) -->
  <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between md:hidden">
    <div class="relative group flex-1">
      <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors pointer-events-none">
        <lucide-icon name="search" [size]="18"></lucide-icon>
      </div>
      <input 
        type="text" 
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
        placeholder="Search categories..." 
        class="pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-sm bg-white hover:border-slate-300 focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none w-full transition-all duration-200 shadow-sm"
      >
    </div>
    <button (click)="startAddCategory()" class="bg-primary hover:bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center justify-center shadow-md active:scale-95 cursor-pointer shrink-0">
      <lucide-icon name="plus" [size]="18" class="mr-1.5"></lucide-icon> Add New Category
    </button>
  </div>

  <!-- Reusable Data Table -->
  <app-data-table 
    [data]="filteredCategories" 
    [columns]="columns" 
    [loading]="loading"
    [actionsTemplate]="actionsTemplate">
  </app-data-table>
</div>

<!-- Category Dialog (Using shared reusable DialogComponent) -->
<app-dialog
  *ngIf="showCategoryModal"
  [title]="selectedCategory ? 'Edit Category' : 'New Category'"
  icon="tags"
  iconClass="text-indigo-600"
  iconBgClass="bg-indigo-50"
  maxWidth="2xl"
  [primaryButtonText]="selectedCategory ? 'Update Category' : 'Create Category'"
  [primaryButtonDisabled]="!categoryName.trim() || savingCategory"
  [primaryButtonLoading]="savingCategory"
  (close)="closeCategoryModal()"
  (primaryAction)="saveCategory()">
  <div class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Category Name</label>
        <input type="text" [(ngModel)]="categoryName" placeholder="e.g. Laptops" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Description</label>
        <input type="text" [(ngModel)]="categoryDescription" placeholder="Brief description" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm">
      </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Choose Icon</label>
        <div class="grid grid-cols-6 sm:grid-cols-8 gap-2 p-3 bg-slate-50 rounded-2xl border border-slate-100 max-h-48 overflow-y-auto custom-scrollbar">
          @for (iconOpt of iconOptions; track iconOpt) {
            <button type="button" (click)="categoryIcon = iconOpt" 
              [class.bg-primary]="categoryIcon === iconOpt"
              [class.text-white]="categoryIcon === iconOpt"
              class="p-2 rounded-lg hover:bg-white hover:shadow-sm transition-all flex items-center justify-center cursor-pointer">
              <lucide-icon [name]="iconOpt" [size]="18"></lucide-icon>
            </button>
          }
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Brand Color</label>
        <div class="grid grid-cols-6 gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-100">
          @for (colorOpt of colorOptions; track colorOpt) {
            <button type="button" (click)="categoryColor = colorOpt" 
              [class.ring-4]="categoryColor === colorOpt"
              class="w-8 h-8 rounded-full bg-{{colorOpt}}-500 transition-all border-2 border-white shadow-sm ring-{{colorOpt}}-400/30 cursor-pointer">
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</app-dialog>

<!-- Custom Templates for Table Cells -->
<ng-template #iconTemplate let-cat>
  <div class="flex items-center">
    <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-{{cat.color || 'slate'}}-50 text-{{cat.color || 'slate'}}-600 mr-3 border border-{{cat.color || 'slate'}}-100">
      <lucide-icon [name]="cat.icon || 'package'" [size]="20"></lucide-icon>
    </div>
    <span class="font-bold text-slate-800">{{ cat.name }}</span>
  </div>
</ng-template>

<ng-template #actionsTemplate let-cat>
  <div class="flex justify-end space-x-1">
    <button (click)="startEditCategory(cat)" class="p-2 text-slate-400 hover:text-primary hover:bg-primary/5 rounded-lg transition-colors">
      <lucide-icon name="pencil" [size]="18"></lucide-icon>
    </button>
    <button (click)="deleteCategory(cat)" class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors">
      <lucide-icon name="trash-2" [size]="18"></lucide-icon>
    </button>
  </div>
</ng-template>

<!-- Shared Reusable Confirmation Modal -->
<app-confirmation-modal
  [show]="showConfirmDelete"
  title="Delete Category?"
  [message]="'Are you sure you want to delete ' + categoryToDelete?.name + '? This action is permanent and might affect assets assigned to this category.'"
  confirmText="Delete Category"
  (confirm)="executeDelete()"
  (cancel)="cancelDelete()">
</app-confirmation-modal>
