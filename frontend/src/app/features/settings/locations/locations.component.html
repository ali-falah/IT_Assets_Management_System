<div class="max-w-4xl mx-auto space-y-6 flex-1 flex flex-col w-full">
  <div class="flex items-center space-x-4 md:hidden">
    <a routerLink="/settings" class="p-2 bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-colors">
      <lucide-icon name="arrow-left" [size]="20"></lucide-icon>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-slate-800 flex items-center">
        <lucide-icon name="map-pin" [size]="24" class="mr-2 text-teal-600"></lucide-icon>
        Manage Locations
      </h1>
      <p class="text-sm text-slate-500 mt-1">Define physical locations and addresses.</p>
    </div>
  </div>

  <!-- Projected Header Actions for Desktop Layout -->
  <ng-template appPageHeaderActions>
    <button (click)="startAddLocation()" class="bg-primary hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-2xs shadow-indigo-200 active:scale-95 cursor-pointer">
      <lucide-icon name="plus" [size]="14"></lucide-icon>
      <span>Add Location</span>
    </button>
  </ng-template>

  <!-- Mobile-only Add button -->
  <div class="flex justify-end md:hidden">
    <button (click)="startAddLocation()" class="bg-primary hover:bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center shadow-md active:scale-95 cursor-pointer">
      <lucide-icon name="plus" [size]="18" class="mr-2"></lucide-icon> Add New Location
    </button>
  </div>

  <!-- Reusable Data Table -->
  <app-data-table 
    [data]="locations" 
    [columns]="columns" 
    [loading]="loading"
    [actionsTemplate]="actionsTemplate">
  </app-data-table>
</div>

<!-- Location Dialog (Using shared reusable DialogComponent) -->
<app-dialog
  *ngIf="showLocationModal"
  [title]="selectedLocation ? 'Edit Location' : 'New Location'"
  icon="map-pin"
  iconClass="text-teal-600"
  iconBgClass="bg-teal-50"
  maxWidth="lg"
  [primaryButtonText]="selectedLocation ? 'Update Location' : 'Save Location'"
  [primaryButtonDisabled]="!locationName.trim() || savingLocation"
  [primaryButtonLoading]="savingLocation"
  (close)="closeLocationModal()"
  (primaryAction)="saveLocation()">
  <div class="space-y-4">
    <div>
      <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Location Name</label>
      <input type="text" [(ngModel)]="locationName" placeholder="e.g. Headquarters"
        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Full Address</label>
      <textarea [(ngModel)]="locationAddress" rows="3" placeholder="Full physical address"
        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all resize-none text-sm"></textarea>
    </div>
  </div>
</app-dialog>

<!-- Actions Template -->
<ng-template #actionsTemplate let-loc>
  <div class="flex justify-end space-x-1">
    <button (click)="startEditLocation(loc)" class="p-2 text-slate-400 hover:text-primary hover:bg-primary/5 rounded-lg transition-colors">
      <lucide-icon name="pencil" [size]="18"></lucide-icon>
    </button>
    <button (click)="deleteLocation(loc)" class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors">
      <lucide-icon name="trash-2" [size]="18"></lucide-icon>
    </button>
  </div>
</ng-template>

<!-- Reusable Confirmation Modal -->
<app-confirmation-modal
  [show]="showConfirmDelete"
  title="Delete Location?"
  [message]="'Are you sure you want to delete ' + locationToDelete?.name + '? This might affect assets assigned to this location.'"
  confirmText="Delete Location"
  (confirm)="executeDelete()"
  (cancel)="cancelDelete()">
</app-confirmation-modal>
